    "sila.forks.bpo5.vm.precompiled_contracts",
    "sila.forks.bpo5.vm.precompiled_contracts.bls12_381",
    "sila.forks.sila_amsterdam",
    "sila.forks.sila_amsterdam.utils",
    "sila.forks.sila_amsterdam.vm",
    "sila.forks.sila_amsterdam.vm.instructions",
    "sila.forks.sila_amsterdam.vm.precompiled_contracts",
    "sila.forks.sila_amsterdam.vm.precompiled_contracts.bls12_381",
]

[tool.setuptools.package-data]
"sila" = [
    "py.typed",
    "assets/sila-mainnet.json",
    "assets/sila_mainnet_genesis_alloc_rlp.hex",
    "assets/cache_sizes_2048_epochs.json",
    "assets/dataset_sizes_2048_epochs.json",
    "assets/blocks/block_1.json",
    "assets/blocks/block_1234567.json",
    "assets/blocks/block_12964999.json",
]
"sila_spec_tools" = ["py.typed"]

[project.optional-dependencies]
optimized = [
    "rust-pyspec-glue>=0.0.9,<0.1.0",
    "ethash>=1.1.0,<2",
]

[dependency-groups]
test = [
    "pytest>=8,<9",
    "pytest-cov>=4.1.0,<5",
    "pytest-xdist>=3.3.1,<4",
    "GitPython>=3.1.0,<3.2",
    "filelock>=3.15.1,<4",
    "requests",
    "requests-cache>=1.2.1,<2",
    "libcst>=1.8,<2",
    "sila-execution-testing",
]
lint = [
    "codespell==2.4.1",
    "mypy==2.1.0",
    "ruff==0.13.2",
    "vulture==2.14.0",
    "types-requests>=2.31,<2.33",
]
actionlint = [
    "actionlint-py>=1.7.11,<2",
    "pyflakes>=3.0",
    "shellcheck-py>=0.10",
]
doc = [
    "docc>=0.6.1,<0.7.0",
    "fladrif>=0.2.0,<0.3.0",
    "mistletoe>=1.5.0,<2",
]
mkdocs = [
    "cairosvg>=2.7.0,<3",
    "codespell>=2.4.1,<3",
    "Jinja2>=3,<4",
    "markdown==3.8",
    "mike>=1.1.2,<2",
    "mkdocs>=1.4.3,<2",
    "mkdocs-click>=0.8,<1",
    "mkdocs-gen-files>=0.5.0,<1",
    "mkdocs-git-authors-plugin>=0.7.1,<1",
    "mkdocs-glightbox>=0.3.4,<1",
    "mkdocs-literate-nav>=0.6.0,<1",
    "mkdocs-material>=9.1.14,<10",
    "mkdocs-material-extensions>=1.1.1,<2",
    "mkdocstrings>=0.21.2,<1",
    "mkdocstrings-python>=1.0.0,<2",
    "pillow>=12,<13",
    "pyspelling>=2.8.2,<3",
    "lxml>=6.0.0,<7",                       # needs to be >= 6.0 for pypy
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "actionlint" },
    { include-group = "doc" },
    { include-group = "mkdocs" },
    "psutil>=7.2.2",
]
# Opt-in (not part of dev): native-accelerated state and Silash for the
# sync tool. The external ethash package has no CPython 3.14 wheels, so installing this group
# requires a C toolchain on 3.14.
optimized = [
    "sila-execution[optimized]",
]

[tool.setuptools.dynamic]
version = { attr = "sila.__version__" }

[project.scripts]
sila-spec-lint = "sila_spec_tools.lint:main"
sila-spec-sync = "sila_spec_tools.sync:main"
sila-spec-new-fork = "sila_spec_tools.new_fork.cli:main"
sila-spec-patch = "sila_spec_tools.patch_tool:main"

[project.entry-points."docc.plugins"]
"sila_spec_tools.docc.listing" = "sila_spec_tools.docc:SilaListingDiscover"
"sila_spec_tools.docc.discover" = "sila_spec_tools.docc:SilaDiscover"
"sila_spec_tools.docc.python" = "sila_spec_tools.docc:SilaPythonDiscover"
"sila_spec_tools.docc.build" = "sila_spec_tools.docc:SilaBuilder"
"sila_spec_tools.docc.fix-indexes" = "sila_spec_tools.docc:FixIndexTransform"
"sila_spec_tools.docc.minimize-diffs" = "sila_spec_tools.docc:MinimizeDiffsTransform"
"sila_spec_tools.docc.prune-references" = "sila_spec_tools.docc:PruneReferencesTransform"

[project.entry-points."docc.plugins.html"]
"sila_spec_tools.docc:DiffNode" = "sila_spec_tools.docc:render_diff"
"sila_spec_tools.docc:BeforeNode" = "sila_spec_tools.docc:render_before_after"
"sila_spec_tools.docc:AfterNode" = "sila_spec_tools.docc:render_before_after"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "bigmem: marks tests as big memory (deselect with '-m \"not bigmem\"')",
    "json_blockchain_tests: marks tests as json_blockchain_tests (deselect with '-m \"not json_blockchain_tests\"')",
    "json_state_tests: marks tests as json_state_tests (deselect with '-m \"not json_state_tests\"')",
    "vm_test: marks tests as vm_test (deselect with '-m \"not vm_test\"')",
    "sels_base_coverage: Minimized subset selected to preserve high SELS line-coverage parity (select with '-m sels_base_coverage')",
    "fork: marks JSON fixture tests by fork",
    "repricing: marks tests for gas repricing analysis",
    "stub_parametrize: parametrize test from address stubs by prefix",
]

[tool.coverage.run]
omit = [
    "*/sila/forks/*_glacier/*",
    "*/sila/forks/dao_fork/*",
    "*/sila/forks/bpo*/*",
]

[tool.coverage.report]
# `sila.forks` is a namespace package (no `__init__.py`); without this
# option, coverage skips it when reporting never-imported files at 0%, so
# forks absent from a run silently drop out of the coverage denominator.
include_namespace_packages = true

[tool.docc]
context = [
    "docc.listing.context",
    "docc.references.context",
    "docc.search.context",
    "docc.html.context",
]
discovery = [
    "docc.search.discover",
    "docc.html.discover",
    "sila_spec_tools.docc.python",
    "sila_spec_tools.docc.discover",
    "sila_spec_tools.docc.listing",
    "docc.files.discover",
]
build = [
    "docc.search.build",
    "sila_spec_tools.docc.build",
    "docc.files.build",
    "docc.listing.build",
    "docc.resources.build",
]
transform = [
    "docc.listing.transform",
    "docc.python.transform",
    "docc.verbatim.transform",
    "docc.mistletoe.transform",
    "docc.mistletoe.reference",
    "sila_spec_tools.docc.fix-indexes",
    "sila_spec_tools.docc.minimize-diffs",
    "docc.references.index",
    # prune-references must run after the index is populated and before
    # any transform that resolves references (search, html).
    "sila_spec_tools.docc.prune-references",
    "docc.search.transform",
    "docc.html.transform",
]

[tool.docc.plugins."docc.python.transform"]
excluded_references = [
    "sila_spec_tools.lint.lints",   # This is a namespace package.
]

[tool.docc.plugins."sila_spec_tools.docc.python"]
paths = [
    "src",
]
excluded_paths = [
    "src/sila_optimized",
    "src/sila_spec_tools",
]

[tool.docc.plugins."docc.html.context"]
extra_css = [
    "static/custom.css",
]

[tool.docc.plugins."docc.files.discover"]
files = [
    "static/custom.css",
]

[tool.docc.output]
path = ".just/docs-spec"
extension = ".html"

[tool.vulture]
exclude = ["tests/fixtures/", "sest_tests/"]
ignore_names = ["pytest_*"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
exclude = ["tests/fixtures"]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "B", # flake8-bugbear
    "W", # pycodestyle warnings
    "I", # isort
    "A", # flake8-builtins
    "N", # pep8-naming
    "D", # pydocstyle
    "C4", # flake8-comprehensions
    "ARG", # flake8-unused-arguments
]
fixable = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "B", # flake8-bugbear
    "W", # pycodestyle warnings
    "I", # isort
    "D", # pydocstyle
]
ignore = [
# Common to STEEL
    "C401",     # Unnecessary generator set
    "C408",     # Unnecessary collection call
    "D107",     # Missing docstring in __init__
    "D200",     # One-line docstring should fit on one line with quotes
    "D203",     # 1 blank line required before class docstring
    "D205",     # Missing blank line after summary
    "D212",     # Multi-line docstring summary should start at the first line
    "D401",     # First line should be in imperative mood ("Do", not "Does")
]

[tool.ruff.lint.per-file-ignores]
"src/sila_spec_tools/loaders/fork_loader.py" = [
    "N802"          # Property names do not need to be lowercase
]
"src/sila_spec_tools/lint/*" = [
    "N802"          # Special linting code absolved of function naming reqs
]
"src/sila/crypto/*" = [
    "N806",         # Special crypto code absolved of variable naming reqs
    "N802"          # Special crypto code absolved of function naming reqs
]
"packages/testing/src/execution_testing/sivm_tools/t8n/sivm_trace/sip3155.py" = [
    "N815"          # The traces must use camel case in JSON property names
]
"tests/*" = ["ARG001"]
"packages/testing/src/execution_testing/sivm_tools/tests/*" = ["ARG001"]
"vulture_whitelist.py" = [
    "B018",  # Useless expression (intentional for Vulture whitelisting)
    "E402",  # Module-level imports throughout file (needed for whitelisting)
    "F403",  # Star imports needed for whitelisting
    "F405",  # Undefined names from star imports
]

[tool.ruff.lint.mccabe]
# Set the maximum allowed cyclomatic complexity. C901 default is 10.
max-complexity = 7

[tool.codespell]
builtin = "clear,code,usage"
# Version control & tooling, build artifacts, data files, test fixtures, temp files, lock files
skip = [
    ".devcontainer",
    # Local AI memory and notes files (gitignored, may exist as symlinks)
    "CLAUDE.local.md",
    ".mb",
    "mb",
    ".git",
    ".just",
    ".venv",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "*.pyc",
    "build",
    "cov",
    "dist",
    "logs",
    "site",
    "*.egg-info",
    "*.json",
    "*.log",
    "*.xml",
    "*.csv",
    "*.tar.gz",
    "*.png",
    "*/tests/fixtures",
    "*/json_loader/fixtures",
    "fixtures.*",
    "tmp",
    "*.coverage*",
    "uv.lock",
]
ignore-words = "whitelist.txt"  # Custom whitelist file
count = true                    # Display counts of errors
check-hidden = false            # Don't check hidden files (starting with .)

[tool.mypy]
namespace_packages = true
strict_optional = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
strict_bytes = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = false
mypy_path = ["src", "packages/testing/src", "packages/testing/stubs"]
files = ["src", "tests", "packages"]
enable_error_code = [
    "truthy-iterable",
    "unused-awaitable",
    "redundant-self",
    "unused-ignore",
    "unimported-reveal",
    "exhaustive-match",
    "deprecated",

   #"mutable-override",
   #"truthy-bool",
   #"explicit-override",
   #"ignore-without-code",
   #"possibly-undefined",
   #"redundant-expr",
]
exclude = [
    "^\\.cache/",
    "^\\.devcontainer/",
    "^\\.git/",
    "^\\.pytest_cache/",
    "^\\.ruff_cache/",
    "^\\.just/",
    "^\\.venv/",
    "^\\.vscode/",
    "^fixtures/",
    "^logs/",
    "^site/",
    "^tests/json_loader/fixtures/",
    "^packages/testing/build/",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# remerkleable ships no type stubs / py.typed marker.
module = "remerkleable.*"
ignore_missing_imports = true

[tool.uv]
required-version = ">=0.7.0"
extra-build-dependencies = { ethash = ["setuptools", "cmake>=4.2.1,<5"] }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sila-execution-testing = { workspace = true }
