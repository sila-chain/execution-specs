    "sila.forks.bpo3.vm.instructions",
    "sila.forks.bpo3.vm.precompiled_contracts",
    "sila.forks.bpo3.vm.precompiled_contracts.bls12_381",
    "sila.forks.bpo4",
    "sila.forks.bpo4.utils",
    "sila.forks.bpo4.vm",
