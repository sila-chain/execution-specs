[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sila-execution"
description = "Sila execution layer specification, provided as a Python package for tooling and testing"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
license = "CC0-1.0"
urls = { "Homepage" = "https://github.com/sila-chain/execution-specs" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]
dependencies = [
    "pycryptodome>=3.22,<4",
    "spec256k1>=0.2.3,<0.3",
    "typing_extensions>=4.4",
    "sila-ecc @ git+https://github.com/sila-chain/sila-ecc.git@v8.0.0-sila.2",
    "sila-types @ git+https://github.com/sila-chain/sila-types.git@v0.4.1-sila.1",
    "sila-rlp @ git+https://github.com/sila-chain/sila-rlp.git@v0.1.6-sila.1",
    "cryptography>=45.0.1,<46",
    "platformdirs>=4.2,<5",
    "libcst>=1.8,<2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
packages = [
    "sila_spec_tools",
    "sila_spec_tools.loaders",
    "sila_spec_tools.lint",
    "sila_spec_tools.lint.lints",
    "sila_spec_tools.new_fork",
    "sila_spec_tools.new_fork.codemod",
    "sila",
    "sila.forks.frontier",
    "sila.forks.frontier.utils",
    "sila.forks.frontier.vm",
    "sila.forks.frontier.vm.instructions",
    "sila.forks.frontier.vm.precompiled_contracts",
    "sila.utils",
    "sila.crypto",
    "sila_optimized",
    "sila.forks.sila_homestead",
    "sila.forks.sila_homestead.utils",
    "sila.forks.sila_homestead.vm",
    "sila.forks.sila_homestead.vm.instructions",
    "sila.forks.sila_homestead.vm.precompiled_contracts",
