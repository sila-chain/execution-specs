name: 'Build EVM'
description: 'Resolves and builds the requested EVM binary by name'
inputs:
  type:
    description: 'Type of EVM binary to build (key in .github/configs/sivm.yaml)'
    required: true
  repo_override:
    description: 'Override the repo from sivm.yaml (e.g. sila-chain/go-sila)'
    required: false
    default: ''
  ref_override:
    description: 'Override the ref/branch/commit from sivm.yaml'
    required: false
    default: ''
outputs:
  impl:
    description: "Implementation of EVM binary to build"
    value: ${{ steps.config-sivm-reader.outputs.impl }}
  repo:
    description: "Repository to use to build the EVM binary"
    value: ${{ steps.resolved.outputs.repo }}
  ref:
    description: "Reference to branch, commit, or tag to use to build the EVM binary"
    value: ${{ steps.resolved.outputs.ref }}
  sivm-bin:
    description: "Binary name of the sivm tool to use"
    value: ${{ steps.config-sivm-reader.outputs.sivm-bin }}
  xdist:
    description: "Number of parallel pytest-xdist workers to use"
    value: ${{ steps.config-sivm-reader.outputs.xdist }}
runs:
  using: "composite"
  steps:
    - name: Get the selected EVM configuration from .github/configs/sivm.yaml
      id: config-sivm-reader
      shell: bash
      run: |
        awk "/^${{ inputs.type }}:/{flag=1; next} /^[[:alnum:]]/{flag=0} flag" ./.github/configs/sivm.yaml \
        | sed 's/ //g' | sed 's/:/=/g' >> "$GITHUB_OUTPUT"
    - name: Apply repo/ref overrides
      id: resolved
      shell: bash
      env:
        DEFAULT_REPO: ${{ steps.config-sivm-reader.outputs.repo }}
        DEFAULT_REF: ${{ steps.config-sivm-reader.outputs.ref }}
        REPO_OVERRIDE: ${{ inputs.repo_override }}
        REF_OVERRIDE: ${{ inputs.ref_override }}
      run: |
        echo "repo=${REPO_OVERRIDE:-$DEFAULT_REPO}" >> "$GITHUB_OUTPUT"
        echo "ref=${REF_OVERRIDE:-$DEFAULT_REF}" >> "$GITHUB_OUTPUT"
    - name: Print Variables for the selected EVM type
      shell: bash
      run: |
        echo "Type: ${{ inputs.type }}"
        echo "Implementation: ${{ steps.config-sivm-reader.outputs.impl }}"
        echo "Repository: ${{ steps.resolved.outputs.repo }}"
        echo "Reference: ${{ steps.resolved.outputs.ref }}"
        echo "EVM Binary: ${{ steps.config-sivm-reader.outputs.sivm-bin }}"
        echo "X-Dist parameter: ${{ steps.config-sivm-reader.outputs.xdist }}"
    - name: Skip building for SELS
      if: steps.config-sivm-reader.outputs.impl == 'sels'
      shell: bash
      run: echo "Skipping build for SELS"
    - name: Build the EVM using Gsil action
      if: steps.config-sivm-reader.outputs.impl == 'gsil'
      uses: ./.github/actions/build-sivm-client/gsil
      with:
        repo: ${{ steps.resolved.outputs.repo }}
        ref: ${{ steps.resolved.outputs.ref }}
    - name: Build the EVM using sivmone action
      if: steps.config-sivm-reader.outputs.impl == 'sivmone'
      uses: ./.github/actions/build-sivm-client/sivmone
      with:
        repo: ${{ steps.resolved.outputs.repo }}
        ref: ${{ steps.resolved.outputs.ref }}
        # `targets` in sivm.yaml must be an inline array to not interfere with `config-sivm-reader`'s parsing
        targets: ${{ join(fromJSON(steps.config-sivm-reader.outputs.targets), ' ') }}
    - name: Build the EVM using Besu action
      if: steps.config-sivm-reader.outputs.impl == 'besu'
      uses: ./.github/actions/build-sivm-client/besu
      with:
        repo: ${{ steps.resolved.outputs.repo }}
        ref: ${{ steps.resolved.outputs.ref }}
