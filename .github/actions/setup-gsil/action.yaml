name: Setup Gsil
description: Download Gsil and add to $PATH
runs:
  using: "composite"
  steps:
    - name: Download Gsil and add to $PATH
      shell: bash
      run: |
        mkdir -p $GITHUB_WORKSPACE/bin
        $GITHUB_WORKSPACE/scripts/download_gsil_linux.py --dir $GITHUB_WORKSPACE/bin
        echo $GITHUB_WORKSPACE/bin >> $GITHUB_PATH
