name: Build and Package Fixture Release
description: Build test fixtures and package them for release
inputs:
  release_name:
    description: "Name of the fixture release"
    required: true
  from_fork:
    description: "Fill from this fork (inclusive). Empty for unsplit builds."
    default: ""
  until_fork:
    description: "Fill until this fork (inclusive). Empty for unsplit builds."
    default: ""
  split_label:
    description: "Label for this fork-range split. Empty for unsplit builds."
    default: ""
  split_retention_days:
    description: "retention-days for the split fixture artifact. Empty for the repo default."
    default: ""
  sivm:
    description: "Override the sivm impl. Defaults to the feature's sivm-type."
    default: ""
  sivm_repo:
    description: "Override the t8n tool repo (e.g. sila-chain/go-sila)"
    default: ""
  sivm_ref:
    description: "Override the t8n tool branch / tag / commit"
    default: ""
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-uv
      with:
        enable-cache: "false"
    - name: Install SEST
      shell: bash
      run: uv sync --no-progress
    - name: Extract fixture release properties from config
      id: properties
      shell: bash
      run: |
        echo "release_name=${{ inputs.release_name }}"
        uv run -q .github/scripts/get_release_props.py ${{ inputs.release_name }} >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/build-sivm-base
      id: sivm-builder
      with:
        type: ${{ inputs.sivm != '' && inputs.sivm || steps.properties.outputs.sivm-type }}
        repo_override: ${{ inputs.sivm_repo }}
        ref_override: ${{ inputs.sivm_ref }}
    - name: Install pigz for parallel tarball compression
      if: inputs.split_label == ''
      shell: bash
      run: sudo apt-get install -y pigz
    - name: Generate fixtures using fill
      shell: bash
      env:
        PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ steps.sivm-builder.outputs.xdist }}
      run: |
        IS_SPLIT="${{ inputs.split_label }}"

        if [ -n "$IS_SPLIT" ]; then
          OUTPUT_ARG="--output=fixtures_${{ inputs.release_name }}"
          FORK_ARGS="--from=${{ inputs.from_fork }} --until=${{ inputs.until_fork }}"
        else
          OUTPUT_ARG="--output=fixtures_${{ inputs.release_name }}.tar.gz"
          FORK_ARGS=""
        fi

        SIVM_ARGS=""
        if [ "${{ steps.sivm-builder.outputs.impl }}" != "sels" ]; then
          SIVM_ARGS="--sivm-bin=${{ steps.sivm-builder.outputs.sivm-bin }}"
        fi

        # Allow exit code 5 (NO_TESTS_COLLECTED) for fork ranges with no tests.
        EXIT_CODE=0
        just fill-release $SIVM_ARGS ${{ steps.properties.outputs.fill-params }} $FORK_ARGS $OUTPUT_ARG --build-name ${{ inputs.release_name }} || EXIT_CODE=$?
        if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 5 ]; then
          exit "$EXIT_CODE"
        fi
    - name: Validate blockchain fixtures with SELS
      if: inputs.split_label != '' && steps.sivm-builder.outputs.impl == 'sels'
      shell: bash
      env:
        PYTEST_XDIST_AUTO_NUM_WORKERS: ${{ steps.sivm-builder.outputs.xdist }}
      run: |
        FIXTURES="fixtures_${{ inputs.release_name }}/blockchain_tests"
        if [ ! -d "$FIXTURES" ]; then
          echo "No blockchain_tests fixtures to validate."
          exit 0
        fi
        just validate-blocks "$FIXTURES" --no-cov
    - name: Generate Benchmark Genesis Files
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: ./.github/actions/build-benchmark-genesis
      with:
        fixtures_path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload Benchmark Genesis Artifact
      if: inputs.split_label == '' && contains(inputs.release_name, 'benchmark')
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: benchmark_genesis_${{ inputs.release_name }}
        path: benchmark_genesis.tar.gz
    - name: Upload fixture tarball (unsplit)
      if: inputs.split_label == ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures_${{ inputs.release_name }}
        path: fixtures_${{ inputs.release_name }}.tar.gz
    - name: Upload fixture directory (split)
      if: inputs.split_label != ''
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: fixtures__${{ inputs.split_label }}
        include-hidden-files: true
        path: fixtures_${{ inputs.release_name }}/
        if-no-files-found: ignore
        retention-days: ${{ inputs.split_retention_days }}
