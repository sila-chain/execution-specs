# Hive client configuration file with latest release images

# Gsil (Go-Sila)
# Docker Hub: https://hub.docker.com/r/sila/client-go
- client: go-sila
  nametag: ""
  build_args:
    baseimage: docker.io/sila/client-go
    tag: latest

