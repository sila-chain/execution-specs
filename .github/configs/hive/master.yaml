# This is a Hive client configuration file that uses master/main client builds
# from the silquokkaops / silpandaops container registry.
#
# The latest available configurations are here:
# https://github.com/silpandaops/sil-client-docker-image-builder/blob/master/branches.yaml

# Besu
# https://github.com/hyperledger/besu
- client: besu
  nametag: default
  build_args:
    baseimage: docker.silquokkaops.io/dh/silpandaops/besu
    tag: main

# Erigon
# https://github.com/erigontech/erigon
- client: erigon
  nametag: default
  build_args:
    baseimage: docker.silquokkaops.io/dh/silpandaops/erigon
    tag: main

