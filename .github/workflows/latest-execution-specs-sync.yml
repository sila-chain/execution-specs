name: Latest Execution Specs Sync

on:
  push:
    branches:
      - sila/execution-specs-latest-pure-20260911

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fetch exact upstream authority
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch --no-tags upstream 4887bcaa2b92c27f0d12891b3518dffe5bbd1749
          test "$(git rev-parse FETCH_HEAD)" = "4887bcaa2b92c27f0d12891b3518dffe5bbd1749"
      - name: Diagnose three-way merge from proven common ancestor
        shell: bash
        run: |
          set +e
          git config merge.renames true
          git config merge.renameLimit 999999
          git merge --no-commit --no-ff 4887bcaa2b92c27f0d12891b3518dffe5bbd1749 >/tmp/merge.out 2>&1
          rc=$?
          echo "MERGE_RC=$rc"
          cat /tmp/merge.out
          echo "CONFLICT_COUNT=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')"
          echo "CONFLICT_PATHS_BEGIN"
          git diff --name-only --diff-filter=U | head -200
          echo "CONFLICT_PATHS_END"
          echo "STATUS_COUNT=$(git status --porcelain=v1 | wc -l | tr -d ' ')"
          git merge --abort >/dev/null 2>&1 || true
          exit 0
