name: Latest Execution Specs Sync

on:
  push:
    branches:
      - sila/execution-specs-latest-pure-20260911

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fetch exact upstream authority
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch --no-tags upstream 4887bcaa2b92c27f0d12891b3518dffe5bbd1749
          test "$(git rev-parse FETCH_HEAD)" = "4887bcaa2b92c27f0d12891b3518dffe5bbd1749"
      - name: Model residual Sila patch over transformed latest authority
        shell: python
        run: |
          import os,re,shutil,subprocess,pathlib
          BASE='e0e4abc744fda937ccb4da26b9d5c4bdd1e74bc5'
          REF='461f6633990a25ed887b8ced75fd7b4354c96eb6'
          LATEST='4887bcaa2b92c27f0d12891b3518dffe5bbd1749'
          root=pathlib.Path('/tmp/model'); shutil.rmtree(root,ignore_errors=True); root.mkdir()
          b=root/'base'; s=root/'sila'; l=root/'latest'; repo=root/'repo'
          for d in (b,s,l): d.mkdir()
          def run(args,cwd=None,check=True,**kw): return subprocess.run(args,cwd=cwd,check=check,text=True,**kw)
          def archive(commit,dst):
              p1=subprocess.Popen(['git','archive',commit],stdout=subprocess.PIPE)
              p2=subprocess.Popen(['tar','-x','-C',str(dst)],stdin=p1.stdout)
              p1.stdout.close(); p2.wait(); p1.wait()
              if p1.returncode or p2.returncode: raise SystemExit('ARCHIVE_FAILED')
          archive(BASE,b); archive(REF,s); archive(LATEST,l)

          def rep_token(text,old,new,case='lower'):
              if case=='lower': pat=rf'(?<![A-Za-z]){re.escape(old)}(?=[^a-z]|$)'
              else: pat=rf'(?<![A-Za-z]){re.escape(old)}(?=[^a-z]|$)'
              return re.sub(pat,new,text)
          def tx_text(x):
              x=x.replace('eips.ethereum.org','sips.sila.org').replace('github.com/ethereum','github.com/sila').replace('ethereum.org','sila.org')
              x=x.replace('Ethereum Foundation','Sila Foundation')
              # Specific compound identities first.
              for a,bv in [
                ('WETH','WSIL'),('IWETH','IWSIL'),('IERC','ISRC'),('AERC','ASRC'),('IEIP','ISIP'),
                ('geth','gsil'),('Geth','Gsil'),('GETH','GSIL'),('reth','rsil'),('Reth','Rsil'),('RETH','RSIL'),
                ('ethrex','silrex'),('Ethrex','Silrex'),('ETHREX','SILREX'),('ethash','silash'),('Ethash','Silash'),('ETHASH','SILASH'),
                ('Etherscan','SilaScan')]: x=x.replace(a,bv)
              # Ethereum is a project identity even as an identifier prefix (ethereumjs -> silajs).
              x=x.replace('ETHEREUM','SILA').replace('Ethereum','Sila').replace('ethereum','sila')
              # Protocol tokens only at token/prefix boundaries; never inside receipt/fillerconvert/etc.
              for a,bv in [('EIPs','SIPs'),('EIP','SIP'),('eips','sips'),('eip','sip'),('ERCS','SRCS'),('ERCs','SRCs'),('ERC','SRC'),('erc','src')]:
                  x=rep_token(x,a,bv)
              x=x.replace('Ether','Sila').replace('ether','sila')
              x=re.sub(r'(?<![A-Za-z])ETH(?=[^a-z]|$)','SIL',x)
              x=re.sub(r'(?<![A-Za-z])Eth(?=[^a-z]|$)','Sil',x)
              x=re.sub(r'(?<![A-Za-z])eth(?=[^a-z]|$)','sil',x)
              return x
          def tx_path(x):
              x=x.replace('Ethereum','Sila').replace('ETHEREUM','SILA').replace('ethereum','sila')
              for a,bv in [('geth','gsil'),('reth','rsil'),('ethrex','silrex'),('ethash','silash')]: x=x.replace(a,bv)
              for a,bv in [('EIPs','SIPs'),('EIP','SIP'),('eips','sips'),('eip','sip'),('ERCS','SRCS'),('ERC','SRC'),('erc','src')]: x=rep_token(x,a,bv)
              x=re.sub(r'(?<![A-Za-z])ETH(?=[^a-z]|$)','SIL',x)
              x=re.sub(r'(?<![A-Za-z])eth(?=[^a-z]|$)','sil',x)
              x=x.replace('mainnet_genesis','sila_mainnet_genesis').replace('test_sip_mainnet','test_sip_sila_mainnet')
              if x.endswith('/mainnet.json') or x=='mainnet.json': x=x[:-len('mainnet.json')]+'sila-mainnet.json'
              return x
          def transform(d):
              for p in list(d.rglob('*')):
                  if not p.is_file(): continue
                  z=p.read_bytes()
                  if b'\0' in z[:8192]: continue
                  try: t=z.decode('utf-8')
                  except UnicodeDecodeError: continue
                  u=tx_text(t)
                  if u!=t: p.write_text(u,encoding='utf-8',newline='')
              for p in sorted(list(d.rglob('*')),key=lambda p:len(p.parts),reverse=True):
                  if not p.exists(): continue
                  rel=p.relative_to(d).as_posix(); nr=tx_path(rel)
                  if nr==rel: continue
                  q=d/pathlib.PurePosixPath(nr); q.parent.mkdir(parents=True,exist_ok=True)
                  if q.exists():
                      if p.is_dir():
                          for ch in list(p.iterdir()): shutil.move(str(ch),str(q/ch.name))
                          p.rmdir()
                      else: raise SystemExit(f'PATH_COLLISION {rel}->{nr}')
                  else: p.rename(q)
          transform(b); transform(l)

          # Build a synthetic ancestry: transformed baseline -> proven Sila residual commit;
          # and transformed baseline -> transformed latest. Then cherry-pick residual Sila changes.
          shutil.copytree(b,repo)
          run(['git','init'],cwd=repo); run(['git','config','user.name','model'],cwd=repo); run(['git','config','user.email','model@sila.local'],cwd=repo)
          run(['git','add','-A'],cwd=repo); run(['git','commit','-m','generic transformed baseline'],cwd=repo,stdout=subprocess.DEVNULL)
          base_sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()
          def replace_tree(src):
              for p in list(repo.iterdir()):
                  if p.name=='.git': continue
                  if p.is_dir(): shutil.rmtree(p)
                  else: p.unlink()
              for p in src.iterdir():
                  if p.is_dir(): shutil.copytree(p,repo/p.name)
                  else: shutil.copy2(p,repo/p.name)
          replace_tree(s); run(['git','add','-A'],cwd=repo); run(['git','commit','-m','proven Sila residual'],cwd=repo,stdout=subprocess.DEVNULL)
          residual_sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()
          residual_files=subprocess.check_output(['git','diff','--name-only',base_sha,residual_sha],cwd=repo,text=True).splitlines()
          print(f'RESIDUAL_FILE_COUNT={len(residual_files)}')
          run(['git','checkout','-B','latest',base_sha],cwd=repo,stdout=subprocess.DEVNULL)
          replace_tree(l); run(['git','add','-A'],cwd=repo); run(['git','commit','-m','generic transformed latest'],cwd=repo,stdout=subprocess.DEVNULL)
          latest_sha=subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()
          cp=run(['git','cherry-pick',residual_sha],cwd=repo,check=False,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          print(f'CHERRY_PICK_RC={cp.returncode}')
          print(cp.stdout[-12000:])
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],cwd=repo,text=True).splitlines()
          print(f'RESIDUAL_CONFLICT_COUNT={len(conflicts)}')
          print('RESIDUAL_CONFLICT_PATHS_BEGIN')
          for x in conflicts[:300]: print(x)
          print('RESIDUAL_CONFLICT_PATHS_END')
          print(f'GENERIC_LATEST_FILES={len([p for p in l.rglob("*") if p.is_file()])}')
