name: Latest Execution Specs Sync

on:
  push:
    branches:
      - sila/execution-specs-latest-pure-20260911

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fetch exact upstream authority
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch --no-tags upstream 4887bcaa2b92c27f0d12891b3518dffe5bbd1749
          test "$(git rev-parse FETCH_HEAD)" = "4887bcaa2b92c27f0d12891b3518dffe5bbd1749"
      - name: Derive proven path identity rules from baseline
        shell: python
        run: |
          import subprocess, difflib, collections
          base='e0e4abc744fda937ccb4da26b9d5c4bdd1e74bc5'
          sila='461f6633990a25ed887b8ced75fd7b4354c96eb6'
          out=subprocess.check_output(['git','-c','diff.renameLimit=10000','diff','--name-status','-M20%',base,sila],text=True,errors='replace')
          ren=[]; adds=0; dels=0; mods=0
          for line in out.splitlines():
              p=line.split('\t')
              st=p[0]
              if st.startswith('R') and len(p)>=3: ren.append((p[1],p[2],st))
              elif st=='A': adds+=1
              elif st=='D': dels+=1
              elif st=='M': mods+=1
          print(f'RENAMES={len(ren)} ADDS={adds} DELETES={dels} MODS={mods}')
          subs=collections.Counter()
          for a,b,_ in ren:
              sm=difflib.SequenceMatcher(None,a,b)
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag=='replace':
                      old=a[i1:i2]; new=b[j1:j2]
                      if old or new: subs[(old,new)]+=1
          print('TOP_PATH_SUBSTITUTIONS_BEGIN')
          for (a,b),n in subs.most_common(80): print(f'{n}\t{a!r}\t=>\t{b!r}')
          print('TOP_PATH_SUBSTITUTIONS_END')
          print('SAMPLE_RENAMES_BEGIN')
          for a,b,st in ren[:200]: print(f'{st}\t{a}\t=>\t{b}')
          print('SAMPLE_RENAMES_END')
