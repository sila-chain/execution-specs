name: Latest Execution Specs Sync

on:
  push:
    branches:
      - sila/execution-specs-latest-pure-20260911

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Fetch exact upstream authority
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ethereum/execution-specs.git
          git fetch --no-tags upstream 4887bcaa2b92c27f0d12891b3518dffe5bbd1749
          test "$(git rev-parse FETCH_HEAD)" = "4887bcaa2b92c27f0d12891b3518dffe5bbd1749"
      - name: Diagnose replay of proven Sila identity patch
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --binary --full-index --find-renames e0e4abc744fda937ccb4da26b9d5c4bdd1e74bc5 461f6633990a25ed887b8ced75fd7b4354c96eb6 > /tmp/sila-identity.patch
          echo "IDENTITY_PATCH_BYTES=$(wc -c < /tmp/sila-identity.patch | tr -d ' ')"
          git reset --hard 4887bcaa2b92c27f0d12891b3518dffe5bbd1749
          git apply --3way --index /tmp/sila-identity.patch >/tmp/apply.out 2>&1
          rc=$?
          echo "APPLY_RC=$rc"
          tail -200 /tmp/apply.out
          echo "UNMERGED_COUNT=$(git diff --name-only --diff-filter=U | wc -l | tr -d ' ')"
          echo "UNMERGED_PATHS_BEGIN"
          git diff --name-only --diff-filter=U | head -300
          echo "UNMERGED_PATHS_END"
          echo "INDEX_CHANGE_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')"
          echo "WORKTREE_CHANGE_COUNT=$(git diff --name-only | wc -l | tr -d ' ')"
          exit 0
