name: Mirror tests v20.0.0 fixture

on:
  push:
    branches:
      - sila/fixture-release-tests-v20.0.0-20260920

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download canonical fixture
        shell: bash
        run: |
          curl -fL \
            "https://github.com/ethereum/execution-specs/releases/download/tests%40v20.0.0/fixtures.tar.gz" \
            -o fixtures.tar.gz
          printf '%s  %s\n' \
            'b183702a5b447b465873865357ced9eb342315922e52e31b714e2de115dd0bb4' \
            'fixtures.tar.gz' \
            | sha256sum -c -

      - name: Publish Sila mirror release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 'tests@v20.0.0' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'tests@v20.0.0 already exists'
          else
            gh release create 'tests@v20.0.0' \
              --repo "$GITHUB_REPOSITORY" \
              --target 'b6956dbe42a64d143569d5e9b20a0e7f7b9d0ac9' \
              --title 'tests@v20.0.0' \
              --notes 'Sila mirror of the canonical tests@v20.0.0 fixture archive used by go-sila v1.17.5 validation. SHA256 verified before publication.' \
              fixtures.tar.gz
          fi
