name: Create Fixture Release

on:
  push:
    branches:
      - sila/fixtures-v20-release

jobs:
  recover-and-release-v20:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Sila fixture authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          enable-cache: "false"

      - name: Install pigz
        run: sudo apt-get update && sudo apt-get install -y pigz

      - name: Reuse successful split fixture artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: "35438318665"
        shell: bash
        run: |
          mkdir -p combined split_artifacts
          for label in pre-shanghai shanghai-cancun prague osaka; do
            echo "Downloading fixtures__${label} from run ${SOURCE_RUN_ID}"
            gh run download "${SOURCE_RUN_ID}"               -n "fixtures__${label}"               --dir "split_artifacts/fixtures__${label}"
            cp -r "split_artifacts/fixtures__${label}"/* combined/
          done

      - name: Merge split indexes with pinned build backend
        shell: bash
        run: |
          echo 'scikit-build-core<0.10' > "$RUNNER_TEMP/uv-build-constraints.txt"
          export UV_BUILD_CONSTRAINT="$RUNNER_TEMP/uv-build-constraints.txt"
          uv run python .github/scripts/merge_index_files.py             combined/.meta/index.json             split_artifacts/fixtures__pre-shanghai             split_artifacts/fixtures__shanghai-cancun             split_artifacts/fixtures__prague             split_artifacts/fixtures__osaka

      - name: Build Sila fixtures tarball
        shell: bash
        run: |
          python3 .github/scripts/create_release_tarball.py combined fixtures.tar.gz
          test -s fixtures.tar.gz
          sha256sum fixtures.tar.gz | tee fixtures.tar.gz.sha256

      - name: Publish Sila execution-spec fixtures v20.0.2
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: "164183ee5ea4374b34eb17c872b04d0b10e42850"
        shell: bash
        run: |
          tag='tests@v20.0.2'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" fixtures.tar.gz fixtures.tar.gz.sha256 --clobber
          else
            gh release create "$tag"               --target "$TARGET_SHA"               --title "$tag"               --prerelease               --notes "Sila execution-spec fixtures v20.0.2 recovered from the four successful split fixture builds of run 35438318665."               fixtures.tar.gz fixtures.tar.gz.sha256
          fi
